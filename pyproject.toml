[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eprep-ai"
version = "0.1.0"
description = "Local-first Windows desktop AI coding assistant for solving programming problems from screenshots"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Abhay Jangid" }
]
dependencies = [
    "PySide6>=6.7.0,<6.9.0",
    "Pillow>=10.3.0,<12.0.0",
    "httpx>=0.27.0,<0.29.0",
    "pydantic>=2.7.0,<3.0.0",
    "rapidocr-onnxruntime>=1.4.0,<2.0.0",
    "onnxruntime>=1.17.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
]

[project.scripts]
eprep-ai = "eprep.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
